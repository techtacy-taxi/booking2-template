<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Επιτυχής Πληρωμή — Booking</title>
<style>
  :root{
    --amber:#E0A227; --amber-deep:#B8720B; --green:#1E8E3E; --green-soft:#E8F5E9;
    --bg:#F7F4EE; --card:#FFFFFF; --border:#E4DCCC; --text:#2A2017; --faint:#7C7264;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    max-width:520px; width:100%; padding:36px 28px 30px; text-align:center;
    box-shadow:0 8px 32px rgba(0,0,0,.08);
  }
  .tick{
    width:76px; height:76px; border-radius:50%; background:var(--green-soft);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
    animation:pop .4s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .tick svg{width:40px;height:40px;stroke:var(--green);stroke-width:3.4;fill:none;
    stroke-linecap:round;stroke-linejoin:round;}
  h1{font-size:23px;margin:0 0 8px;font-weight:800;letter-spacing:-.01em;}
  .lead{font-size:15px;color:var(--faint);line-height:1.6;margin:0 0 22px;}
  .info{
    background:var(--bg); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin:0 0 22px; text-align:left; font-size:14px; line-height:1.9;
  }
  .info b{color:var(--amber-deep);}
  .note{
    font-size:13.5px; color:var(--faint); line-height:1.6;
    background:#FFF8EC; border:1px solid #F0DFC0; border-radius:12px;
    padding:12px 14px; margin:0 0 24px; text-align:left;
  }
  .btn{
    display:inline-block; width:100%; padding:14px 18px; border-radius:12px;
    font-size:15.5px; font-weight:700; text-decoration:none; cursor:pointer;
    border:none; transition:filter .15s, transform .1s;
  }
  .btn:active{transform:scale(.99);}
  .btn-primary{background:var(--amber-deep); color:#fff; margin-bottom:10px;}
  .btn-primary:hover{filter:brightness(1.07);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .brand{margin-top:22px; font-size:12.5px; color:var(--faint);}
  .brand a{color:var(--amber-deep); text-decoration:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="tick">
      <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
    </div>

    <h1>Η πληρωμή ολοκληρώθηκε</h1>
    <p class="lead">
      Σας ευχαριστούμε! Η πληρωμή σας ελήφθη και η μεταφορά σας επιβεβαιώθηκε.
    </p>

    <div class="info" id="info" style="display:none;">
      <div id="infoRows"></div>
    </div>

    <div class="note">
      📧 Θα λάβετε email επιβεβαίωσης με όλες τις λεπτομέρειες της κράτησής σας.<br>
      Αν δεν το δείτε μέσα σε λίγα λεπτά, ελέγξτε τον φάκελο ανεπιθύμητων.
    </div>

    <a class="btn btn-primary" href="booking2.html">Νέα κράτηση</a>
  </div>

<script>
(function () {
  var p = new URLSearchParams(location.search);
  var rows = [];
  var b = p.get('booking') || p.get('bookingNumber');
  var amt = p.get('amount');
  var from = p.get('from'), to = p.get('to');
  if (b)   rows.push('<b>Κωδικός κράτησης:</b> #' + b);
  if (from && to) rows.push('<b>Διαδρομή:</b> ' + from + ' → ' + to);
  if (amt) rows.push('<b>Πληρώθηκε:</b> ' + amt + ' €');
  if (rows.length) {
    document.getElementById('infoRows').innerHTML = rows.join('<br>');
    document.getElementById('info').style.display = 'block';
  }
  if (window.history.replaceState) {
    window.history.replaceState(null, '', location.pathname);
  }
})();
</script>
</body>
</html>
